# /etc/nginx/sites-available/automotoresaro
# Plantilla: deploy/nueva-agencia.sh reemplaza TUDOMINIO.com.ar y PUERTO.
# A mano: reemplazalos y después: sudo certbot --nginx -d TUDOMINIO.com.ar -d www.TUDOMINIO.com.ar
server {
    listen 80;
    server_name TUDOMINIO.com.ar www.TUDOMINIO.com.ar;

    # Fotos que sube el panel (ya llegan achicadas, pero por las dudas)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:PUERTO;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
